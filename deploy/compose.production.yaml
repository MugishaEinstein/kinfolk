services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env.production
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - kinfolk-db:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: ..
      dockerfile: deploy/kinfolk.Dockerfile
      target: build
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    command: ["pnpm", "drizzle-kit", "migrate"]
    networks: [internal]
    restart: "no"

  kinfolk:
    build:
      context: ..
      dockerfile: deploy/kinfolk.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["3000"]
    networks: [internal, proxy]

  nostr-relay:
    image: scsibug/nostr-rs-relay:0.8.12
    restart: unless-stopped
    volumes:
      - ../deploy/relay/config.toml:/usr/src/app/config.toml:ro
      - nostr-relay-data:/data
    command: ["--config", "/usr/src/app/config.toml"]
    expose: ["8080"]
    networks: [proxy]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    expose: ["9000"]
    networks: [internal, proxy]

  minio-init:
    image: minio/mc:latest
    env_file: .env.production
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set kinfolk http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing kinfolk/kinfolk;
      exit 0;
    networks: [internal]
    restart: "no"

volumes:
  kinfolk-db:
  nostr-relay-data:
  minio-data:

networks:
  internal:
    internal: true
  proxy:
    external: true
    name: proxy
