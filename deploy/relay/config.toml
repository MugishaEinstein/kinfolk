[info]
relay_url = "wss://relay.nostr.africa/"
name = "Kinfolk Private Relay"
description = "Private signed event relay for Kinfolk family homes."

[database]
engine = "sqlite"
data_directory = "/data"

[network]
address = "0.0.0.0"
port = 8080
remote_ip_header = "x-forwarded-for"
ping_interval = 120

[options]
reject_future_seconds = 1800

[limits]
messages_per_sec = 10
subscriptions_per_min = 20
max_event_bytes = 32768
max_ws_message_bytes = 32768
max_ws_frame_bytes = 32768
event_kind_allowlist = [1, 22242]
limit_scrapers = true

[authorization]
# Replace only when you intentionally rotate KINFOLK_NOSTR_SECRET_KEY.
# Run `docker compose exec kinfolk node scripts/relay-pubkey.mjs` to derive the matching public key.
pubkey_whitelist = [
  "d8924e4f4b1ae75b1704f97937aff09fdf6dc6393f16073dfbe8762a6ed7739b",
]
nip42_auth = true
nip42_dms = false
